project:
  type: website
  output-dir: _site
  resources:
    - figures/build/*.svg
    - figures/build/*.pdf
    - assets/**

website:
  title: "L4 Fluid Mechanics"
  description: "Course materials for ENGI44710 / ENGI47215 Fluid Mechanics, Durham University"
  site-url: "https://majidbastankhah.github.io/l4-fluid-mechanics"
  repo-url: "https://github.com/majidbastankhah/l4-fluid-mechanics"
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Notes"
        href: notes/index.qmd
      - text: "Slides"
        href: slides.qmd
      - text: "Problems"
        href: problems/index.qmd
      - text: "Workshops"
        href: workshops/index.qmd
      - text: "Resources"
        menu:
          - text: "Exam formula sheet"
            href: resources/formula-sheet.qmd
          - text: "Problem-solving strategy"
            href: resources/solving-strategy.qmd
          - text: "What's new"
            href: whats-new.qmd
  sidebar:
    - title: "Notes"
      style: docked
      contents:
        - notes/index.qmd
        - notes/ch1.qmd
        - notes/ch2.qmd
        - notes/ch3.qmd
        - notes/ch4.qmd
  page-footer:
    left: "L4 Fluid Mechanics · Dr Majid Bastankhah · Department of Engineering, Durham University"
    right: "Spotted a mistake? Highlight it and click **⚑ Report a mistake**."

format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [darkly, assets/theme.scss, assets/theme-dark.scss]
    css: assets/site.css
    include-after-body: assets/report.html
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    html-math-method: mathjax
    fig-cap-location: bottom
    crossref:
      chapters: true

filters:
  - assets/svg-to-pdf.lua
