# Renders the site with Quarto and deploys it to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish course site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Quarto (with TinyTeX for the PDF notes)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render site
        run: quarto render

      - name: Set up Python (for the slide PDFs)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save every slide deck as a PDF (_site/slides/pdf/)
        run: |
          pip install playwright pypdf
          python -m playwright install --with-deps chromium
          python _dev/make-slide-pdfs.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
