<!-- Adds "Home" and "All slides" links to the slide menu (☰, bottom left; or press M),
     removes "Speaker View" from its Tools panel, and makes the speaker view (S) show only the
     current slide and the notes (no upcoming slide), and lets the stylus erase drawings with its
     barrel button or eraser end.
     Included in every deck via slides/_metadata.yml (include-after-body). -->
<style>
.slide-menu-wrapper .slide-menu-toolbar > li.sm-link { padding: 0; }
.slide-menu-wrapper .slide-menu-toolbar > li.sm-link a { display: block; color: #aaa; text-decoration: none; line-height: 150%; }
.slide-menu-wrapper .slide-menu-toolbar > li.sm-link a:hover { color: #fff; }
.slide-menu-wrapper .slide-menu-toolbar > li.sm-link svg { width: 1.8rem; height: 1.8rem; vertical-align: -0.125em; fill: currentColor; }
.slide-menu-wrapper .slide-menu-toolbar > li.sm-link .slide-menu-toolbar-label { visibility: visible; }
</style>
<script>
(function () {
  var LINKS = [
    { href: '../index.html', label: 'Home',
      svg: '<path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5ZM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5 5 5Z"/>' },
    { href: '../slides.html', label: 'All slides',
      svg: '<path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3z"/>' }
  ];
  function add() {
    var bar = document.querySelector('.slide-menu-wrapper .slide-menu-toolbar');
    if (!bar) return false;
    if (bar.querySelector('.sm-link')) return true;
    // drop "Speaker View" from the Tools panel (the speaker view is for the lecturer)
    var sv = document.querySelector('.slide-menu-wrapper a[onclick*="speakerMode"]');
    if (sv) {
      var list = sv.closest('ul');
      sv.closest('li').remove();
      list.querySelectorAll('li.slide-tool-item').forEach(function (li, i) {
        li.setAttribute('data-item', i);
        li.classList.toggle('active', i === 0);
      });
    }
    var close = bar.querySelector('#close');
    LINKS.forEach(function (l) {
      var li = document.createElement('li');
      li.className = 'sm-link';
      li.innerHTML = '<a href="' + l.href + '"><svg viewBox="0 0 16 16" aria-hidden="true">' + l.svg +
        '</svg><br><span class="slide-menu-toolbar-label">' + l.label + '</span></a>';
      bar.insertBefore(li, close);
    });
    return true;
  }
  function whenReady() { if (!add()) setTimeout(whenReady, 200); }
  if (window.Reveal && Reveal.isReady && Reveal.isReady()) whenReady();
  else if (window.Reveal) Reveal.on('ready', whenReady);
  window.addEventListener('load', whenReady);
})();

// Pen eraser for the chalkboard (C / B): erase by holding the stylus's barrel button or by using
// the eraser end of the pen, as in OneNote. The chalkboard plugin already erases with the right
// mouse button, so these pen events are passed on to it as a right-button drag.
(function () {
  function isPenEraser(e) {
    return e.pointerType === 'pen' &&
      (e.button === 2 || e.button === 5 || (e.buttons & 2) !== 0 || (e.buttons & 32) !== 0);
  }
  function onBoard(t) { return t && t.tagName === 'CANVAS' && t.hasAttribute('data-chalkboard'); }
  let target = null;
  var R = 20;   // the plugin's sponge erases a circle of radius 20 px below-right of the pointer: centre it on the pen tip
  function relay(type, e) {
    target.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window,
      clientX: e.clientX - R, clientY: e.clientY - R, screenX: e.screenX - R, screenY: e.screenY - R,
      button: 2, buttons: type === 'mouseup' ? 0 : 2 }));
  }
  document.addEventListener('pointerdown', function (e) {
    if (!onBoard(e.target) || !isPenEraser(e)) return;
    e.preventDefault(); e.stopPropagation();       // also stops the browser's own mouse events for this stroke
    target = e.target;
    try { target.setPointerCapture(e.pointerId); } catch (err) {}
    relay('mousedown', e);
  }, true);
  document.addEventListener('pointermove', function (e) {
    if (!target || e.pointerType !== 'pen') return;
    e.preventDefault(); relay('mousemove', e);
  }, true);
  ['pointerup', 'pointercancel'].forEach(function (t) {
    document.addEventListener(t, function (e) {
      if (!target || e.pointerType !== 'pen') return;
      e.preventDefault(); relay('mouseup', e); target = null;
    }, true);
  });
})();

// Speaker view (S): show only the current slide (left) and the notes (right), no "upcoming" slide.
(function () {
  var CSS =
    '#upcoming-slide, #speaker-layout { display: none !important; }' +
    '#current-slide { display: block !important; position: absolute !important; top: 0 !important; left: 0 !important;' +
    '  width: 64% !important; height: 100% !important; padding: 6px !important; }' +
    '#speaker-controls { position: absolute !important; top: 0 !important; left: 64% !important; right: auto !important;' +
    '  width: 36% !important; height: 100% !important; padding-top: 6px !important; font-size: 1.25em !important; }' +
    '.speaker-controls-time .timer, .speaker-controls-time .clock { font-size: 1.3em !important; white-space: nowrap; }';
  function style(w) {
    try {
      var d = w.document;
      if (!d || !d.getElementById('current-slide')) return false;
      if (!d.getElementById('l4-speaker-css')) {
        var s = d.createElement('style'); s.id = 'l4-speaker-css'; s.textContent = CSS;
        (d.head || d.documentElement).appendChild(s);
      }
      return true;
    } catch (e) { return true; }   // not accessible: leave the default view
  }
  var open = window.open;
  window.open = function (url, name) {
    var w = open.apply(window, arguments);
    if (w && name === 'reveal.js - Notes') {
      var n = 0;
      (function poll() { if (!style(w) && ++n < 100) setTimeout(poll, 50); })();
    }
    return w;
  };
})();
</script>
